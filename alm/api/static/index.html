<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALM · Federation Console</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%236366f1%22/><path d=%22M7 17l5-10 5 10M9 13h6%22 stroke=%22white%22 stroke-width=%221.6%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l5-10 5 10M9 13h6"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">ALM</span>
          <span class="brand-subtitle">Federation Console</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-route="overview" aria-current="page">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Visão geral</span>
        </button>
        <button class="nav-item" data-route="chat">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5a2.5 2.5 0 0 1-2.5 2.5H8l-4 3V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5Z"/><path d="M8.5 10.5h7M8.5 13.5h4"/></svg>
          <span>Conversar</span>
        </button>
        <button class="nav-item" data-route="agents">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M17 7h5M19.5 4.5v5"/></svg>
          <span>Agentes</span>
        </button>
        <button class="nav-item" data-route="data">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8V6"/><path d="M4.5 12c0 1.6 3.4 2.8 7.5 2.8s7.5-1.2 7.5-2.8"/></svg>
          <span>Dados</span>
        </button>
        <button class="nav-item" data-route="orchestration">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="19" r="2.4"/><circle cx="19" cy="19" r="2.4"/><path d="M12 7.4V12m0 0-5.4 5m5.4-5 5.4 5"/></svg>
          <span>Orquestração</span>
        </button>
        <button class="nav-item" data-route="performance">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9m6 10V4m6 15v-7m6 7V11"/></svg>
          <span>Performance</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="conn" id="connStatus">
          <span class="conn-dot" id="connDot"></span>
          <span id="connLabel">conectando…</span>
        </div>
        <div class="sidebar-actions">
          <button class="icon-btn" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
          <button class="icon-btn" id="settingsToggle" title="Configurações da API" aria-label="Configurações">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4.6a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.4 2.6a7.6 7.6 0 0 0-2.6 1.5l-2.4-.6-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-.6a7.6 7.6 0 0 0 2.6 1.5L10 22h4l.4-2.6a7.6 7.6 0 0 0 2.6-1.5l2.4.6 2-3.5-2-1.5Z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">Visão geral</h1>
          <p id="pageSubtitle" class="muted">Saúde da federação e inventário em tempo real</p>
        </div>
        <div class="topbar-actions" id="topbarActions"></div>
      </header>

      <main class="content" id="content" aria-live="polite">
        <div class="empty-state">
          <div class="spinner"></div>
          <p>Carregando…</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Settings panel -->
  <div class="modal-backdrop" id="settingsBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-header">
        <h2 id="settingsTitle">Conexão com a API</h2>
        <button class="icon-btn" id="settingsClose" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">URL base da API</span>
          <input type="text" id="apiBaseInput" placeholder="http://localhost:8000" />
        </label>
        <label class="field">
          <span class="field-label">Token (Bearer), se ALM_API_TOKEN estiver definido</span>
          <input type="password" id="apiTokenInput" placeholder="opcional" />
        </label>
        <p class="hint">Os valores ficam salvos apenas neste navegador (localStorage).</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="settingsCancel">Cancelar</button>
        <button class="btn btn-primary" id="settingsSave">Salvar e reconectar</button>
      </div>
    </div>
  </div>

  <!-- Generic drill-down drawer (eval run detail) -->
  <div class="modal-backdrop" id="drawerBackdrop" hidden>
    <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="modal-header">
        <h2 id="drawerTitle">Detalhe</h2>
        <button class="icon-btn" id="drawerClose" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body" id="drawerBody"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
